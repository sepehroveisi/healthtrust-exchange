services:
  authority-ledger-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: healthtrust
      POSTGRES_PASSWORD: healthtrust
      POSTGRES_DB: healthtrust_test
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthtrust -d healthtrust_test"]
      interval: 1s
      timeout: 2s
      retries: 30
    tmpfs: [/var/lib/postgresql/data]
